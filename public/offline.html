<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线 · CityPulse</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9f9f9;
        color: #1a1c1c;
        padding: 24px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1c1c; color: #e2e2e2; }
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #ff6b35;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        margin: 0 auto 20px;
      }
      h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
      p { font-size: 15px; opacity: 0.7; line-height: 1.6; max-width: 320px; }
      button {
        margin-top: 24px;
        background: #ab3500;
        color: #fff;
        border: 0;
        padding: 12px 28px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="icon">🧭</div>
      <h1>当前处于离线状态</h1>
      <p>已保存的路线仍可在恢复网络后查看。请检查你的网络连接，然后重试。</p>
      <button onclick="location.reload()">重新加载</button>
    </div>
  </body>
</html>
