name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 取消同一分支上仍在运行的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check .

  quality:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # 构建/类型检查不依赖真实数据库（读路径回退 mock），用占位值即可
      DATABASE_URL: "postgresql://citypulse:citypulse@localhost:5432/citypulse?schema=public"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload build output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3

  database:
    name: Schema · Seed (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: citypulse
          POSTGRES_PASSWORD: citypulse
          POSTGRES_DB: citypulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citypulse -d citypulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://citypulse:citypulse@localhost:5432/citypulse?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply schema to database
        run: npx prisma db push

      - name: Seed database
        run: npm run db:seed

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # E2E 对生产构建跑冒烟用例，读路径回退 mock，无需真实数据库
      DATABASE_URL: "postgresql://citypulse:citypulse@localhost:5432/citypulse?schema=public"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 汇总门：所有 CI 检查通过后才算绿，便于设为唯一的分支保护必需项
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, quality, database, e2e]
    if: ${{ always() }}
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ 有 CI 检查未通过"
            exit 1
          fi
          echo "✅ 所有 CI 检查通过"
