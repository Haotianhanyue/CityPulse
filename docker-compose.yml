# CityPulse 本地生产级数据库：PostgreSQL + PostGIS
# 用法：
#   docker compose up -d          # 启动数据库
#   npm run db:migrate            # 应用迁移（首次会创建 PostGIS 扩展）
#   npm run db:seed               # 填充示例数据
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: citypulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: citypulse
      POSTGRES_PASSWORD: citypulse
      POSTGRES_DB: citypulse
    ports:
      - "5432:5432"
    volumes:
      - citypulse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citypulse -d citypulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citypulse-db-data:
