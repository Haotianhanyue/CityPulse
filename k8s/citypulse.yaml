---
# CityPulse 应用密钥（demo 用；外部服务密钥留空，功能降级但可启动）
apiVersion: v1
kind: Secret
metadata:
  name: citypulse-secrets
  namespace: demo
type: Opaque
stringData:
  DATABASE_URL: "postgresql://citypulse:citypulse@citypulse-db:5432/citypulse?schema=public"
  NEXTAUTH_SECRET: "zHDtCTbcsCJK6ROEevKhuWQyBYXY9GwCUiUAO0tnAxI="
  NEXTAUTH_URL: "http://localhost:3000"
---
# PostGIS 数据库（demo：emptyDir 临时存储，重启数据丢失）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citypulse-db
  namespace: demo
  labels: { app: citypulse-db }
spec:
  replicas: 1
  selector: { matchLabels: { app: citypulse-db } }
  template:
    metadata:
      labels: { app: citypulse-db }
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4
          env:
            - { name: POSTGRES_USER, value: citypulse }
            - { name: POSTGRES_PASSWORD, value: citypulse }
            - { name: POSTGRES_DB, value: citypulse }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "citypulse", "-d", "citypulse"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: citypulse-db
  namespace: demo
spec:
  selector: { app: citypulse-db }
  ports:
    - { port: 5432, targetPort: 5432 }
---
# CityPulse Next.js 应用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citypulse
  namespace: demo
  labels: { app: citypulse }
spec:
  replicas: 1
  selector: { matchLabels: { app: citypulse } }
  template:
    metadata:
      labels: { app: citypulse }
    spec:
      initContainers:
        # 等待 DB 就绪并用 prisma db push 建表
        - name: db-push
          image: 993099901546.dkr.ecr.eu-central-1.amazonaws.com/citypulse:v1
          command:
            - sh
            - -c
            - "until npx prisma db push --skip-generate --accept-data-loss; do echo 'waiting for db...'; sleep 5; done"
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: citypulse-secrets, key: DATABASE_URL } }
      containers:
        - name: citypulse
          image: 993099901546.dkr.ecr.eu-central-1.amazonaws.com/citypulse:v1
          ports:
            - { containerPort: 3000 }
          envFrom:
            - secretRef: { name: citypulse-secrets }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: citypulse
  namespace: demo
spec:
  selector: { app: citypulse }
  ports:
    - { port: 80, targetPort: 3000 }
