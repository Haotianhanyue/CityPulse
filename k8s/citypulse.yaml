---
# CityPulse 应用密钥（demo 用；外部服务密钥留空，功能降级但可启动）
apiVersion: v1
kind: Secret
metadata:
  name: citypulse-secrets
  namespace: demo
type: Opaque
stringData:
  DATABASE_URL: "postgresql://citypulse:citypulse@citypulse-db:5432/citypulse?schema=public"
  NEXTAUTH_SECRET: "zHDtCTbcsCJK6ROEevKhuWQyBYXY9GwCUiUAO0tnAxI="
  NEXTAUTH_URL: "http://localhost:3000"
---
# [Sync Wave 0] PostGIS 数据库（demo：emptyDir 临时存储，重启数据丢失）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citypulse-db
  namespace: demo
  labels: { app: citypulse-db }
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector: { matchLabels: { app: citypulse-db } }
  template:
    metadata:
      labels: { app: citypulse-db }
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4
          env:
            - { name: POSTGRES_USER, value: citypulse }
            - { name: POSTGRES_PASSWORD, value: citypulse }
            - { name: POSTGRES_DB, value: citypulse }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "citypulse", "-d", "citypulse"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: citypulse-db
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector: { app: citypulse-db }
  ports:
    - { port: 5432, targetPort: 5432 }
---
# [Sync Hook · Wave 1] 数据库迁移（DB 就绪后执行 prisma db push 建表）
# BeforeHookCreation：每次同步前删旧 Job，保证可重复执行
apiVersion: batch/v1
kind: Job
metadata:
  name: citypulse-db-migrate
  namespace: demo
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels: { app: citypulse-db-migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: 993099901546.dkr.ecr.eu-central-1.amazonaws.com/citypulse:v1
          command:
            - sh
            - -c
            - "until npx prisma db push --skip-generate --accept-data-loss; do echo 'waiting for db...'; sleep 5; done"
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: citypulse-secrets, key: DATABASE_URL } }
---
# [Sync Wave 2] CityPulse Next.js 应用（已移除 db-push initContainer，改由迁移 Hook 负责）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citypulse
  namespace: demo
  labels: { app: citypulse }
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector: { matchLabels: { app: citypulse } }
  template:
    metadata:
      labels: { app: citypulse }
    spec:
      containers:
        - name: citypulse
          image: 993099901546.dkr.ecr.eu-central-1.amazonaws.com/citypulse:v1
          ports:
            - { containerPort: 3000 }
          envFrom:
            - secretRef: { name: citypulse-secrets }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: citypulse
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector: { app: citypulse }
  ports:
    - { port: 80, targetPort: 3000 }
---
# [PostSync Hook] 冒烟测试：同步完成后 curl 首页，非 200 则 Job 失败 → ArgoCD 报红 + 飞书告警
# HookSucceeded：成功后自动删除 Job；失败则保留以便查日志
apiVersion: batch/v1
kind: Job
metadata:
  name: citypulse-smoke-test
  namespace: demo
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: { app: citypulse-smoke-test }
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              echo "冒烟测试：访问 citypulse 首页..."
              for i in $(seq 1 12); do
                code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://citypulse.demo.svc.cluster.local/ 2>/dev/null)
                echo "第 $i 次: HTTP $code"
                if [ "$code" = "200" ]; then echo "✅ 冒烟测试通过"; exit 0; fi
                sleep 6
              done
              echo "❌ 冒烟测试失败：首页未返回 200"; exit 1
